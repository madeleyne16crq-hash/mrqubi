<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRQ-UBI | Ubicación en tiempo real</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            /* TONOS AJUSTADOS: Morados más oscuros y elegantes para contraste en fondo claro */
            --fondo-panel: #ffffff;
            --morado-principal: #4c1d95; /* Morado oscuro vibrante */
            --morado-linea: #5b21b6;     /* Morado fuerte para la línea del recorrido */
            --morado-hover: #371b6d;
            --texto-principal: #1e1b4b;  /* Azul/Morado muy oscuro para máxima lectura */
            --texto-secundario: #6b7280;
            --borde: #e5e7eb;
            --sombra: rgba(15, 23, 42, 0.12);
            --error: #dc2626;
            --exito: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8fafc;
            color: var(--texto-principal);
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        #mapa {
            width: 100vw;
            height: 100vh;
        }

        /* CAPA SUPERIOR */
        .barra-superior {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--borde);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px var(--sombra);
            animation: aparecerIzquierda 0.7s ease forwards;
        }

        .marca-icono {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: linear-gradient(135deg, #5b21b6, #4c1d95);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(76, 29, 149, 0.3);
        }

        .marca {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--texto-principal);
            letter-spacing: 0.04em;
        }

        .marca span {
            color: var(--morado-principal);
        }

        .estado-conexion {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            padding-left: 12px;
            border-left: 1px solid var(--borde);
            font-size: 10px;
            color: var(--texto-secundario);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .punto-conexion {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--exito);
            box-shadow: 0 0 8px rgba(22, 163, 74, 0.4);
            animation: parpadear 1.8s infinite;
        }

        .punto-conexion.error {
            background: var(--error);
            box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
            animation: none;
        }

        /* PANEL DE INFORMACIÓN */
        .panel-ubicacion {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 20;
            width: 285px;
            padding: 22px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--borde);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px var(--sombra);
            animation: aparecerDerecha 0.7s ease forwards;
        }

        .titulo-panel {
            margin-bottom: 18px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--morado-principal);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .dato-ubicacion {
            padding: 11px 0;
            border-bottom: 1px solid var(--borde);
        }

        .dato-ubicacion:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .dato-nombre {
            display: block;
            margin-bottom: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--texto-secundario);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .dato-valor {
            display: block;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--texto-principal);
        }

        .dato-valor.destacado {
            color: var(--morado-principal);
        }

        /* BOTÓN DE CENTRAR */
        .boton-centrar {
            position: absolute;
            right: 28px;
            bottom: 30px;
            z-index: 20;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: var(--morado-principal);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(76, 29, 149, 0.35);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .boton-centrar:hover {
            transform: translateY(-3px);
            background: var(--morado-hover);
        }

        .boton-centrar:active {
            transform: scale(0.94);
        }

        .boton-centrar svg {
            width: 21px;
            height: 21px;
            color: #ffffff;
        }

        .mapboxgl-ctrl-bottom-right,
        .mapboxgl-ctrl-bottom-left {
            display: none;
        }

        /* ANIMACIONES */
        @keyframes aparecerIzquierda {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes aparecerDerecha {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes parpadear {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.35;
            }
        }

        @media (max-width: 600px) {
            .barra-superior {
                top: 15px;
                left: 15px;
                padding: 10px 15px;
            }

            .estado-conexion {
                display: none;
            }

            .panel-ubicacion {
                top: 15px;
                right: 15px;
                width: 220px;
                padding: 17px;
            }

            .dato-valor {
                font-size: 15px;
            }

            .boton-centrar {
                right: 18px;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div id="mapa"></div>

    <!-- IDENTIDAD DEL SISTEMA -->
    <div class="barra-superior">
        <div class="marca-icono">MR</div>
        <div class="marca">MRQ-<span>UBI</span></div>
        <div class="estado-conexion">
            <div class="punto-conexion" id="punto-conexion"></div>
            <span id="texto-estado">Conectando...</span>
        </div>
    </div>

    <!-- INFORMACIÓN DE UBICACIÓN -->
    <div class="panel-ubicacion">
        <div class="titulo-panel">Coordenadas actuales</div>

        <div class="dato-ubicacion">
            <span class="dato-nombre">Latitud</span>
            <span class="dato-valor destacado" id="valor-latitud">Cargando...</span>
        </div>

        <div class="dato-ubicacion">
            <span class="dato-nombre">Longitud</span>
            <span class="dato-valor destacado" id="valor-longitud">Cargando...</span>
        </div>

        <div class="dato-ubicacion">
            <span class="dato-nombre">Actualizado</span>
            <span class="dato-valor" id="valor-hora">--:--:--</span>
        </div>
    </div>

    <!-- BOTÓN PARA VOLVER A LA UBICACIÓN -->
    <button class="boton-centrar" id="boton-centrar" title="Centrar ubicación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 2v4" />
            <path d="M12 18v4" />
            <path d="M2 12h4" />
            <path d="M18 12h4" />
        </svg>
    </button>

    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
        import {getFirestore, doc, onSnapshot} from "https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore.js";

        // CREDENCIALES DEL PROYECTO mrqubi-c5b93
        const configuracionFirebase = {
            apiKey: "AIzaSyBo-zOniks9WxRxon2lgWkay2NnGxfydH4",
            authDomain: "mrqubi-c5b93.firebaseapp.com",
            projectId: "mrqubi-c5b93",
            storageBucket: "mrqubi-c5b93.firebasestorage.app",
            messagingSenderId: "90897057335",
            appId: "1:90897057335:web:9b7b0f4699d0d2d2e6e1b2",
            measurementId: "G-21JCNEN6LS"
        };

        const aplicacion = initializeApp(configuracionFirebase);
        const baseDatos = getFirestore(aplicacion);

        mapboxgl.accessToken = 'pk.eyJ1IjoibWFkZWxleW5lMTYwNnJxIiwiYSI6ImNtc3Fvamh0dzB0NGEyeW9xcHh6OTFtbm4ifQ.x2c5pYlK6Sh8lbmCEDQu4A';

        // CONFIGURADO EN MODO CLARO (light-v11)
        const mapa = new mapboxgl.Map({
            container: 'mapa',
            style: 'mapbox://styles/mapbox/light-v11',
            center: [-68.1011478864, -16.489094232999996],
            zoom: 14
        });

        // MARCADOR OSCURECIDO PARA MEJOR VISIBILIDAD
        const elementoMarcador = document.createElement('div');
        elementoMarcador.style.cssText = `
            width: 22px;
            height: 22px;
            background: #4c1d95;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(76, 29, 149, 0.25), 0 4px 15px rgba(0,0,0,0.3);
        `;

        const marcador = new mapboxgl.Marker({element: elementoMarcador})
            .setLngLat([-68.1011478864, -16.489094232999996])
            .addTo(mapa);

        let longitudActual = -68.1011478864;
        let latitudActual = -16.489094232999996;

        const coordenadasRuta = [];

        mapa.on('load', () => {
            mapa.addSource('ruta', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': coordenadasRuta
                    }
                }
            });

            // LÍNEA DE RECORRIDO EN MORADO INTENSO
            mapa.addLayer({
                'id': 'linea-ruta',
                'type': 'line',
                'source': 'ruta',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#5b21b6', // Morado oscuro/intenso para resaltar sobre fondo blanco
                    'line-width': 5,
                    'line-opacity': 0.9
                }
            });
        });

        function centrarUbicacion() {
            mapa.flyTo({
                center: [longitudActual, latitudActual],
                zoom: 15,
                speed: 1.4
            });
        }

        document.getElementById('boton-centrar').addEventListener('click', centrarUbicacion);

        const referenciaUbicacion = doc(baseDatos, "ubi", "UserUbi");
        const puntoConexion = document.getElementById('punto-conexion');
        const textoEstado = document.getElementById('texto-estado');

        onSnapshot(referenciaUbicacion, (documento) => {
            if (!documento.exists()) {
                textoEstado.textContent = "Sin datos";
                puntoConexion.classList.add('error');
                return;
            }

            const datos = documento.data();

            if (datos?.latitud === undefined || datos?.longitud === undefined) {
                textoEstado.textContent = "Datos incompletos";
                puntoConexion.classList.add('error');
                return;
            }

            const nuevaLatitud = parseFloat(datos.latitud);
            const nuevaLongitud = parseFloat(datos.longitud);

            if (nuevaLatitud >= -90 && nuevaLatitud <= 90 && nuevaLongitud >= -180 && nuevaLongitud <= 180) {
                latitudActual = nuevaLatitud;
                longitudActual = nuevaLongitud;

                puntoConexion.classList.remove('error');
                textoEstado.textContent = "MapBox mcrq";

                marcador.setLngLat([longitudActual, latitudActual]);

                mapa.easeTo({
                    center: [longitudActual, latitudActual],
                    duration: 1000
                });

                const puntoNuevo = [longitudActual, latitudActual];
                const ultimoPunto = coordenadasRuta[coordenadasRuta.length - 1];

                if (!ultimoPunto || ultimoPunto[0] !== longitudActual || ultimoPunto[1] !== latitudActual) {
                    coordenadasRuta.push(puntoNuevo);

                    if (mapa.getSource('ruta')) {
                        mapa.getSource('ruta').setData({
                            'type': 'Feature',
                            'properties': {},
                            'geometry': {
                                'type': 'LineString',
                                'coordinates': coordenadasRuta
                            }
                        });
                    }
                }

                document.getElementById('valor-latitud').textContent = latitudActual.toFixed(6);
                document.getElementById('valor-longitud').textContent = longitudActual.toFixed(6);
                document.getElementById('valor-hora').textContent = datos.hora || "—";
            }
        }, (error) => {
            console.error("Error al conectar con Firestore:", error);
            textoEstado.textContent = "Error de red";
            puntoConexion.classList.add('error');
        });
    </script>

</body>

</html>
